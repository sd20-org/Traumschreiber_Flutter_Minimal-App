# Keep Gradle's memory use modest (Flutter's template default is -Xmx8G); release builds need the 1 GB metaspace.
org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=1g -XX:ReservedCodeCacheSize=256m
kotlin.daemon.jvmargs=-Xmx768m -XX:MaxMetaspaceSize=256m
org.gradle.workers.max=2
android.useAndroidX=true
